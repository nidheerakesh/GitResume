<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Dark background for favicon -->
  <rect width="48" height="48" rx="10" fill="#1a2233"/>
  
  <!-- GR Monogram - Circuit/Git-branch style -->
  <g transform="translate(6, 7) scale(0.75)">
    <!-- G shape: top arc curving from right to left and down -->
    <path d="M30 8 C30 8 32 6 34 8 C36 10 34 12 32 12 L22 12 C14 12 8 18 8 26 L8 28 C8 28 6 30 8 32 C10 34 12 32 12 30 L12 26 C12 20 16 16 22 16 L28 16" 
          stroke="#3B8DD6" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- G bottom horizontal bar -->
    <path d="M12 30 L12 34 C12 38 16 42 22 42 L28 42" 
          stroke="#3B8DD6" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- R vertical stroke -->
    <path d="M28 16 L28 42" 
          stroke="#1E6AAF" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    
    <!-- R top bump/curve -->
    <path d="M28 16 L34 16 C40 16 40 24 34 24 L28 24" 
          stroke="#1E6AAF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- R diagonal leg -->
    <path d="M32 24 L40 42" 
          stroke="#1E6AAF" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    
    <!-- Circuit nodes -->
    <circle cx="34" cy="8" r="3.5" fill="#3B8DD6"/>
    <circle cx="10" cy="30" r="3.5" fill="#3B8DD6"/>
  </g>
</svg>